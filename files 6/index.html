<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BedLink — Emergency Response Command Center</title>
<style>
:root{--navy:#0b2545;--blue:#13498f;--teal:#0f9d8a;--red:#d92d3a;--amb:#d98a00;--bg:#f4f7fb;--card:#fff;--line:#e2e8f0;--tx:#13213a;--mut:#64748b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,sans-serif}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}
header b{font-size:18px;letter-spacing:.5px}header .s{opacity:.75}.sp{margin-left:auto;display:flex;gap:16px;align-items:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#7a8aa5;margin-right:6px}.on .dot{background:#35e0b0;box-shadow:0 0 0 4px #35e0b033}
.flow{display:flex;justify-content:center;gap:10px;align-items:center;padding:10px;background:#fff;border-bottom:1px solid var(--line);font-weight:600;color:var(--blue)}
.flow i{font-style:normal;color:var(--mut);transition:.3s}.flow .hit{color:var(--teal);transform:scale(1.25)}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;transition:.15s}button:hover{border-color:var(--blue);transform:translateY(-1px)}
button.p{background:var(--blue);color:#fff;border-color:var(--blue)}button.r{background:var(--red);color:#fff;border-color:var(--red)}button.t{background:var(--teal);color:#fff;border-color:var(--teal)}
button:disabled{opacity:.6;cursor:not-allowed}button:disabled:hover{transform:none}
main{display:grid;grid-template-columns:minmax(300px,1fr) minmax(340px,1.2fr) minmax(340px,1.2fr);gap:16px;padding:16px 24px}@media(max-width:1100px){main{grid-template-columns:1fr}}
.col>h2{margin:0 0 8px;font-size:12px;letter-spacing:1.2px;color:var(--mut)}.col{border-top:3px solid var(--c)}.col.a{--c:var(--blue)}.col.h{--c:var(--teal)}.col.d{--c:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0b25451a}.card h3{margin:0 0 10px;font-size:13px;color:var(--navy)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.m{color:var(--mut)}.big{font-size:22px;font-weight:700}
.b{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#e8eef7;color:var(--blue)}.CRITICAL,.EMERGENCY{background:#fde8ea;color:var(--red)}.HIGH{background:#fff3dc;color:var(--amb)}.AVAILABLE,.OK{background:#dff5f0;color:var(--teal)}.LOW,.BUSY{background:#fff3dc;color:var(--amb)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cap{border:1px solid var(--line);border-radius:10px;padding:8px}.bar{height:6px;background:#e8eef7;border-radius:4px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal);transition:width .5s}.bar i.LOW{background:var(--amb)}.bar i.CRITICAL{background:var(--red)}
.alert{border:1px solid var(--red);background:#fff5f5;border-left:5px solid var(--red)}.pulse{animation:p 1.2s 2}@keyframes p{50%{box-shadow:0 0 0 8px #d92d3a33}}
.feed{max-height:230px;overflow:auto}.feed div{padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}.feed time{color:var(--mut);margin-right:6px;font-variant-numeric:tabular-nums}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13px}tr.cl{cursor:pointer}tr.cl:hover{background:#f4f7fb}
svg text{font:11px system-ui}#toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9}
#modal{position:fixed;inset:0;background:#0b254588;display:none;align-items:center;justify-content:center;z-index:8}#modal>div{background:#fff;border-radius:14px;padding:20px;width:min(680px,94vw);max-height:90vh;overflow:auto}
select{padding:4px;border-radius:6px;border:1px solid var(--line)}details summary{cursor:pointer;font-weight:600}
.fr{font-size:12px;font-weight:600}.fr.live{color:var(--teal)}.fr.aging{color:var(--amb)}.fr.stale{color:var(--red)}
.sel{border:2px solid var(--teal)}select.hs{border:2px solid var(--teal);padding:6px 8px;font-weight:600;color:var(--navy)}
.ctl{display:inline-flex;align-items:center;gap:6px}.ctl button{padding:1px 9px;font-size:16px;line-height:1.2}.ctl b{min-width:30px;text-align:center;font-size:16px}
.chat div{padding:6px 8px;border-radius:8px;margin-bottom:5px;border:0}.chat .user{background:#e8eef7}.chat .bot{background:#dff5f0}
input{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips button{font-size:12px;padding:4px 10px;border-radius:99px}
.mc{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}.mc.best{border-color:var(--teal)}.chip{display:inline-block;margin:2px 4px 2px 0;font-size:12px}.chip.ok{color:var(--teal)}.chip.no{color:var(--red);font-weight:700}
.MODERATE,.INFO{background:#e8eef7;color:var(--blue)}.fb{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}
.cd{font-variant-numeric:tabular-nums;font-weight:700}.cd.low{color:var(--red)}
.hold{border:2px solid var(--teal);border-radius:12px;padding:12px;margin-top:14px;background:#f3fbf9}.hold.done{border-color:var(--blue);background:#f4f7fb}.hold.fail{border-color:var(--red);background:#fff5f5}
.hold h3{margin:0 0 8px}.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.tabs button{font-size:12px;padding:4px 10px;border-radius:99px}.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
#vbox{position:relative}#vtip{position:absolute;display:none;background:var(--navy);color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;pointer-events:none;z-index:2;white-space:nowrap}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px}.leg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}.vchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.vchips span{background:#e8eef7;border-radius:8px;padding:3px 8px;font-size:12px}
.hist div{padding:3px 0;font-size:13px}
</style></head><body>
<header><b>BEDLINK</b><span class="s">Emergency Response Command Center</span><span class="sp"><span id="live"><span class="dot"></span><span id="lt">CONNECTING</span></span><span id="clock"></span><span id="nb">🔔 <b id="nc">0</b></span><span>Dispatcher · Ops Lead</span>
<button class="p" onclick="post('demo')">▶ Demo Mode</button><button onclick="post('demo/reset')">Reset</button></span></header>
<div class="flow"><i id="f1">🚑 AMBULANCE</i>→<i id="f2">⚙ BACKEND (triage)</i>→<i id="f3">🏥 HOSPITAL</i>+<i id="f4">🚨 DISPATCH</i></div>
<div id="toast"></div><div id="modal" onclick="if(event.target==this)this.style.display='none'"><div id="md"></div></div>
<main id="app"><div class="card">Connecting to backend…</div></main>
<script>
let S=null,sel='AMB-204',filt='all',lastEv=null;const $=s=>document.querySelector(s);
const post=async(p,b)=>{try{const r=await fetch('/api/'+p,{method:'POST',body:JSON.stringify(b||{})});const j=await r.json();if(!r.ok)toast(j.error.message)}catch(e){toast('Backend unreachable')}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3200)};
setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString(),1000);
const st=(q,r)=>{const p=q/r*100;return p<25?'CRITICAL':p<50?'LOW':'AVAILABLE'};
function flash(){['f1','f2','f3','f4'].forEach((id,i)=>setTimeout(()=>{const e=$('#'+id);e.classList.add('hit');setTimeout(()=>e.classList.remove('hit'),500)},i*250))}
function gauge(sc,lv){if(sc==null)return'<div class="m">No active patient</div>';const c=lv=='CRITICAL'?'#d92d3a':lv=='HIGH'?'#d98a00':'#0f9d8a',r=48,L=2*Math.PI*r;
return `<svg width="130" height="130" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#e8eef7" stroke-width="10"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${c}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${L*sc/100} ${L}" transform="rotate(-90 60 60)" style="transition:stroke-dasharray .6s"/><text x="60" y="62" text-anchor="middle" style="font:700 28px system-ui" fill="${c}">${sc}</text><text x="60" y="80" text-anchor="middle" fill="#64748b">/ 100</text></svg>`}
function spark(a,k,col){const h=a.hist.map(x=>x[k]);if(h.length<2)return'<small class="m">not enough data</small>';const mn=Math.min(...h),mx=Math.max(...h)||1,d=mx-mn||1;
return `<svg width="240" height="40"><polyline fill="none" stroke="${col}" stroke-width="2" points="${h.map((v,i)=>`${i*240/(h.length-1)},${36-(v-mn)/d*32}`).join(' ')}"/></svg>`}
function map(){const as=Object.values(S.ambulances).filter(a=>a.status!='AVAILABLE');return `<svg viewBox="0 0 400 190" width="100%" style="background:#eaf1f8;border-radius:10px"><g stroke="#d3deec" stroke-width="1">${[...Array(8)].map((_,i)=>`<line x1="${i*57}" y1="0" x2="${i*57}" y2="190"/><line x1="0" y1="${i*27}" x2="400" y2="${i*27}"/>`).join('')}</g>
<rect x="340" y="70" width="40" height="40" rx="8" fill="#0f9d8a"/><text x="360" y="95" text-anchor="middle" fill="#fff">🏥</text><text x="360" y="125" text-anchor="middle" fill="#13213a">CityCare</text>
${as.map((a,i)=>{const y=40+i*50,x=30+a.progress*290;return `<line x1="30" y1="${y}" x2="340" y2="90" stroke="${a.level=='CRITICAL'?'#d92d3a':'#13498f'}" stroke-dasharray="5 4" stroke-width="2"/><g style="transition:.6s" transform="translate(${x},${y+(90-y)*a.progress-10})"><circle r="13" fill="#fff" stroke="#d92d3a" stroke-width="2"/><text y="4" text-anchor="middle">🚑</text></g><text x="${x}" y="${y+(90-y)*a.progress+20}" text-anchor="middle" fill="#13213a">${a.id}${a.eta!=null?' · ETA '+a.eta+'m':''}</text>`}).join('')}</svg>`}
let modalCtx=null,modalSig='',vtab='hr',_vc=null;
// Vital history source. Uses the backend's real readings (a.hist) when there are >=3; otherwise realistic SAMPLE data so the chart is never empty.
// To use another source later, change ONLY vitalHistory() - it must return {live:boolean, rows:[{time,hr,spo2,sys,dia,temp,rr}]}.
const MOCK_VITALS=[{m:-30,hr:92,spo2:98,sys:128,dia:82,temp:36.8,rr:18},{m:-25,hr:96,spo2:97,sys:130,dia:84,temp:36.9,rr:18},{m:-20,hr:101,spo2:96,sys:132,dia:86,temp:37.0,rr:19},{m:-15,hr:108,spo2:95,sys:135,dia:88,temp:37.1,rr:20},{m:-10,hr:112,spo2:94,sys:138,dia:90,temp:37.2,rr:21},{m:-5,hr:118,spo2:93,sys:142,dia:92,temp:37.3,rr:22},{m:0,hr:121,spo2:92,sys:145,dia:94,temp:37.4,rr:23}];
const VT=[['hr','Heart Rate','bpm',[['hr','Heart rate','#d92d3a']]],['spo2','SpO₂','%',[['spo2','SpO₂','#13498f']]],['bp','Blood Pressure','mmHg',[['sys','Systolic','#d98a00'],['dia','Diastolic','#0f9d8a']]],['temp','Temperature','°C',[['temp','Temperature','#7c3aed']]],['rr','Resp. Rate','/min',[['rr','Resp. rate','#0f9d8a']]]];
const hhmm=ms=>new Date(ms).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
function vitalHistory(a){const h=a.hist||[];if(h.length>=3)return{live:true,rows:h.map(x=>({time:x.t,hr:x.hr,spo2:x.spo2,sys:x.sys,dia:x.dia,temp:x.temp,rr:x.rr}))};
const b=Math.floor(nowS()/60)*60000;return{live:false,rows:MOCK_VITALS.map(x=>({...x,time:hhmm(b+x.m*60000)}))}}
function vChart(rows,tab){const [,title,unit,ser]=VT.find(t=>t[0]==tab),W=600,H=250,L=48,R=16,T=16,B=44,n=rows.length,dec=unit=='°C'?1:0;
const vals=ser.flatMap(([k])=>rows.map(r=>r[k]).filter(v=>typeof v=='number'));if(!vals.length)return'<div class="m">No readings for this vital yet.</div>';
let lo=Math.min(...vals),hi=Math.max(...vals);const pd=(hi-lo)*.2||1;lo-=pd;hi+=pd;
const X=i=>L+(n==1?(W-L-R)/2:i*(W-L-R)/(n-1)),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B),step=Math.ceil(n/7),cw=(W-L-R)/Math.max(n-1,1);_vc={rows,ser,unit,xs:rows.map((_,i)=>X(i))};
return `<div class="leg">${ser.map(([,l,c])=>`<span><i style="background:${c}"></i>${l} (${unit})</span>`).join('')}</div><div id="vbox"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${title} history chart" onmouseleave="vtipHide()">
${[0,1,2,3,4].map(k=>{const v=lo+(hi-lo)*k/4;return `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e2e8f0"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" fill="#64748b">${v.toFixed(dec)}</text>`}).join('')}
<line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" stroke="#94a3b8"/><line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="#94a3b8"/><text x="${L}" y="${T-4}" fill="#64748b">${unit}</text>
${rows.map((r,i)=>i%step==0||i==n-1?`<text x="${X(i)}" y="${H-B+16}" text-anchor="middle" fill="#64748b">${r.time}</text>`:'').join('')}<text x="${(L+W-R)/2}" y="${H-6}" text-anchor="middle" fill="#64748b">Time</text>
<line id="vl" y1="${T}" y2="${H-B}" stroke="#94a3b8" stroke-dasharray="3 3" style="display:none"/>
${ser.map(([k,,c])=>{const p=rows.map((r,i)=>typeof r[k]=='number'?[X(i),Y(r[k])]:null).filter(Boolean);return `<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" points="${p.map(q=>q.join(',')).join(' ')}"/>${p.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="#fff" stroke="${c}" stroke-width="2.5"/>`).join('')}`}).join('')}
${rows.map((r,i)=>`<rect x="${X(i)-cw/2}" y="${T}" width="${cw}" height="${H-T-B}" fill="transparent" onmousemove="vtip(event,${i})"/>`).join('')}</svg><div id="vtip"></div></div>`}
function vtip(e,i){const c=_vc,t=$('#vtip'),bx=$('#vbox').getBoundingClientRect(),vl=$('#vl');t.innerHTML=`<b>${c.rows[i].time}</b>`+c.ser.map(([k,l,col])=>`<div><span style="color:${col}">●</span> ${l}: <b>${c.rows[i][k]??'—'} ${c.unit}</b></div>`).join('');t.style.display='block';
t.style.left=Math.max(0,Math.min(bx.width-170,e.clientX-bx.left+14))+'px';t.style.top=Math.max(0,e.clientY-bx.top-14)+'px';vl.setAttribute('x1',c.xs[i]);vl.setAttribute('x2',c.xs[i]);vl.style.display=''}
function vtipHide(){const t=$('#vtip'),v=$('#vl');if(t)t.style.display='none';if(v)v.style.display='none'}
function setVtab(t){vtab=t;renderDetail()}
function attemptsHTML(r){return (r.attempts||[]).map(t=>`<div>${t.outcome=='TIMED_OUT'?'⏱':'✕'} ${esc(t.hospital_name)} — <b>${t.outcome=='TIMED_OUT'?'TIMED OUT':'DECLINED'}</b>${t.reason?' · '+esc(t.reason):''}</div>`).join('')}
function holdBox(a,viewer){const r=a.request;if(!r)return'';const pend=r.status=='PENDING',acc=r.status=='ACCEPTED',mine=pend&&viewer&&viewer==r.hospital_id,at=attemptsHTML(r);
const stat=pend?'Awaiting Confirmation':acc?'ACCEPTED / CONFIRMED':'No Suitable Hospital Available';
return `<div class="hold ${acc?'done':pend?'':'fail'}"><h3>CONFIRM &amp; HOLD</h3><div class="hgrid"><div><span class="m">Hospital</span><br><b>${esc(r.hospital_name||'—')}</b></div><div><span class="m">Status</span><br><b>${stat}</b></div></div>
${pend?`<div style="margin:8px 0"><span class="m">Time Remaining</span><br><span class="big">${cd(r)}</span></div>`:''}
${at?`<div class="hist m" style="margin-top:6px">Earlier offers:${at}</div>`:''}
${mine?`<div class="btns" style="margin-top:8px"><button class="t" onclick="post('hospital/accept',{id:'${a.id}',hospital:'${viewer}'})">✓ ACCEPT</button><button class="r" onclick="declineDlg('${a.id}','${viewer}')">✕ DECLINE</button></div>`:pend?'<div class="m" style="margin-top:6px">Only the hospital currently offered this ambulance can accept or decline.</div>':''}</div>`}
const sigOf=a=>JSON.stringify([a.request,a.vitals,(a.hist||[]).length,a.status,a.eta]);
function renderDetail(){if(!modalCtx)return;const {id,h}=modalCtx,a=S.ambulances[id],v=a.vitals,r=a.request,md=$('#md'),sc=md.scrollTop;modalSig=sigOf(a);
if(!a.patient){md.innerHTML=`<div class="row"><h3>${id} — PATIENT DETAILS</h3><button onclick="$('#modal').style.display='none'">✕</button></div><p class="m">No active patient.</p>`;return}
const vh=vitalHistory(a),cond=r?r.condition:(a.need?a.need.label:a.patient.type);
md.innerHTML=`<div class="row"><h3>${r?'INCOMING AMBULANCE REQUEST — ':''}${id}</h3><button onclick="$('#modal').style.display='none'">✕</button></div>
<h3 style="margin-top:6px">PATIENT INFORMATION</h3><div class="grid"><div>Patient ID<br><b>${a.patient.id}</b></div><div>Age / type<br><b>${a.patient.age} · ${a.patient.type}</b></div><div>Emergency / condition<br><b>${esc(cond)}</b></div><div>Triage<br><b>${a.score} ${a.level}</b></div><div>ETA / Dest.<br><b>${a.eta??'—'} min · ${a.dest}</b></div><div>Location<br><b>${a.loc}</b></div><div style="grid-column:1/-1">Ambulance / crew<br><b>${id} · ${a.crew.join(', ')}</b></div></div>
<h3 style="margin-top:14px">PATIENT VITAL HISTORY</h3>${v?`<div class="vchips"><span>HR <b>${v.hr}</b> bpm</span><span>SpO₂ <b>${v.spo2}</b>%</span><span>BP <b>${v.sys}/${v.dia}</b></span><span>Temp <b>${v.temp!=null?v.temp:'—'}</b> °C</span><span>RR <b>${v.rr}</b></span></div>`:''}
<div class="tabs">${VT.map(t=>`<button class="${t[0]==vtab?'on':''}" onclick="setVtab('${t[0]}')">${t[1]}</button>`).join('')}</div>${vChart(vh.rows,vtab)}
<div class="m" style="font-size:12px">${vh.live?`Live readings from the ambulance monitor (${vh.rows.length} points). Hover for values.`:'Sample data shown — fewer than 3 live readings recorded so far. Hover for values.'}</div>${holdBox(a,h)}`;md.scrollTop=sc}
function detail(id,h){modalCtx={id,h:h||null};$('#modal').style.display='flex';renderDetail()}
let hsel='citycare',hfilt='all',mx=null,off=0;const nowS=()=>(Date.now()+off)/1000;
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ageTxt=ts=>{const a=Math.max(0,nowS()-ts);return a<10?['live','● Updated just now']:a<60?['live',`● Updated ${Math.floor(a)} sec ago`]:a<600?['aging',`● Updated ${Math.floor(a/60)} min ago`]:a<900?['aging',`⚠ Data is ${Math.floor(a/60)} min old`]:['stale','⚠ STALE DATA']};
const fr=ts=>{const [c,t]=ageTxt(ts);return `<span class="fr ${c}" data-ts="${ts}">${t}</span>`};
setInterval(()=>document.querySelectorAll('.fr').forEach(e=>{const [c,t]=ageTxt(+e.dataset.ts);e.className='fr '+c;e.textContent=t}),1000);
const capSt=(q,t)=>q==0?['CRITICAL','FULL']:q/t<.25?['LOW','LOW']:['AVAILABLE','AVAILABLE'];
const supSt=(q,r)=>q==0?['CRITICAL','OUT OF STOCK']:q/r<.25?['CRITICAL','CRITICAL']:q/r<.5?['LOW','LOW STOCK']:['AVAILABLE','AVAILABLE'];
const upd=(k,n,d)=>post('hospital/resource',{hospital:hsel,kind:k,name:n,delta:d});
const ctl=(k,n,q)=>`<span class="ctl"><button aria-label="decrease ${n}" onclick="upd('${k}','${n}',-1)">−</button><b>${q}</b><button aria-label="increase ${n}" onclick="upd('${k}','${n}',1)">+</button></span>`;
const ask=async p=>{const el=$('#chat');const t=p||(el&&el.value);if(!t)return;if(el)el.value='';await post('ambulance/query',{id:'AMB-204',text:t})};
const ring=(sc,c)=>{const r=20,L=2*Math.PI*r;return `<svg width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="${r}" fill="none" stroke="#e8eef7" stroke-width="6"/><circle cx="27" cy="27" r="${r}" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${L*sc/100} ${L}" transform="rotate(-90 27 27)" style="transition:stroke-dasharray .6s"/><text x="27" y="31" text-anchor="middle" style="font:700 14px system-ui" fill="${c}">${sc}</text></svg>`};
function matchCard(m,i){const a=S.ambulances['AMB-204'],rq=a.request&&a.request.hospital_id==m.id?a.request:null,at=a.request&&(a.request.attempts||[]).find(t=>t.hospital_id==m.id),busy=a.request&&['PENDING','ACCEPTED'].includes(a.request.status),W=S.weights,c=m.score>=80?'#0f9d8a':m.score>=60?'#d98a00':'#d92d3a',L={resource:'Resource compatibility',bed:'Bed availability',travel:'Travel efficiency',freshness:'Data freshness',load:'Hospital load'};
return `<div class="mc ${i==0?'best':''}"><div class="row"><div class="row" style="gap:10px">${ring(m.score,c)}<div><b>${i+1}. ${esc(m.name)}</b>${rq?(rq.status=='PENDING'?' <span class="b HIGH">● REQUEST PENDING</span>':rq.status=='ACCEPTED'?' <span class="b AVAILABLE">✓ ACCEPTED</span>':' <span class="b CRITICAL">✕ DECLINED</span>'):at?(at.outcome=='TIMED_OUT'?' <span class="b HIGH">⏱ TIMED OUT</span>':' <span class="b CRITICAL">✕ DECLINED</span>'):''}<div class="m">${m.prev!=null?(m.score<m.prev?'▼':'▲')+' was '+m.prev+' · ':''}Operation Match / 100</div></div></div></div>
<div style="margin-top:6px"><div>${m.res.map(r=>`<span class="chip ${r.ok?'ok':'no'}">${r.ok?'✓':'✕'} ${r.name}</span>`).join('')}</div><div class="fb"><span>Bed · ${m.bed.name}</span><b class="chip ${m.bed.ok?'ok':'no'}">${m.bed.ok?'✓ AVAILABLE ('+m.bed.avail+')':'✕ FULL'}</b></div><div class="fb"><span>Travel</span><b>${m.eta} min · ${m.km} km</b></div><div class="fb"><span>Freshness</span>${m.fresh.state=='STALE'?'<b class="fr stale">⚠ STALE DATA</b>':fr(nowS()-m.fresh.age)}</div><div class="fb"><span>Load</span><b>${m.load}%</b></div></div>
${mx==m.id?`<div class="cap" style="margin-top:6px"><b>WHY THIS MATCH?</b>${Object.keys(L).map(k=>`<div class="fb"><span>${L[k]}</span><span>${Math.round(m.fr[k]*100)}% · ${m.pts[k]}/${W[k]}</span></div>`).join('')}<div class="fb"><b>Operation Match Score</b><b>${m.score}</b></div><small class="m">Operational demo score, not clinically validated.</small></div>`:''}
<div style="margin-top:8px"><button onclick="mx=mx=='${m.id}'?null:'${m.id}';render()">VIEW DETAILS</button> ${rq&&rq.status=='PENDING'?'<button class="p" disabled>● REQUEST PENDING</button>':rq&&rq.status=='ACCEPTED'?'<button class="t" disabled>✓ HOSPITAL ACCEPTED</button>':at?`<button disabled>${at.outcome=='TIMED_OUT'?'TIMED OUT':'REQUEST DECLINED'}</button>`:`<button class="p" ${busy?'disabled':''} onclick="post('ambulance/hospital-request',{id:'AMB-204',hospital:'${m.id}'})">REQUEST ACCEPTANCE</button>`}</div></div>`}
function chatMatch(){const a=S.ambulances['AMB-204'],ch=a.chat||[],ms=S.matches['AMB-204']||[],nd=a.need;
return `<div class="card"><h3>MEDICAL OPERATIONS ASSISTANT <small class="m">(database lookup · no LLM)</small></h3><div class="feed chat" id="chatlog">${ch.map(c=>`<div class="${c.r}"><b>${c.r=='user'?'You':'Assistant'}:</b> ${esc(c.m)}</div>`).join('')||'<span class="m">Try “Find hospitals with ICU beds”</span>'}</div>
<div class="row" style="margin-top:8px"><input id="chat" placeholder="Describe the patient or ask for a resource…" onkeydown="if(event.key=='Enter')ask()"><button class="p" onclick="ask()">Send</button></div>
<h3 style="margin:10px 0 0;font-size:11px" class="m">QUICK DEMO PROMPTS</h3><div class="chips">${['Severe Chest Pain','Road Accident','Breathing Difficulty','Stroke Symptoms','Major Bleeding','Unconscious Patient','High Fever'].map(p=>`<button onclick="ask('${p}')">${p}</button>`).join('')}</div></div>
${nd?`<div class="card"><h3>REQUIREMENTS — ${nd.label} <span class="b ${nd.pri}">${nd.pri}</span></h3>${nd.req.map(r=>`<span class="b" style="margin-right:4px">${r}</span>`).join('')}</div>`:''}
<div class="card" id="opmatch"><h3>OPERATION MATCH <small class="m">· live, recalculated from hospital data</small></h3>${ms.map(matchCard).join('')||'<span class="m">Choose a demo prompt or ask a question to see ranked hospitals.</span>'}</div>`}
const pad2=n=>String(n).padStart(2,'0'),REASONS=['No ICU capacity','No trauma bed','Resources unavailable','Emergency department overloaded','Other'];
const fmtCd=dl=>{const t=Math.max(0,Math.ceil(dl-nowS()));return pad2(Math.floor(t/60))+':'+pad2(t%60)};
const cd=r=>`<span class="cd ${Math.ceil(r.deadline-nowS())<=30?'low':''}" data-dl="${r.deadline}">${fmtCd(r.deadline)}</span>`;
setInterval(()=>document.querySelectorAll('.cd').forEach(e=>{const d=+e.dataset.dl;e.textContent=fmtCd(d);e.classList.toggle('low',Math.ceil(d-nowS())<=30)}),250);
function reqCard(x){const r=x.request;return `<div class="card alert"><h3>🚑 INCOMING AMBULANCE REQUEST</h3><div class="row"><span class="big">${x.id}</span><span class="b ${r.level}">${r.level}</span></div><div style="margin-top:4px"><b>${esc(r.condition)}</b></div><div>Triage Score: <b>${r.triage_score}</b></div><div>ETA: <b>${pad2(r.eta)} min</b></div><div>Required: <b>${r.required.length?r.required.map(esc).join(' • '):'—'}</b></div><div class="hgrid" style="margin:8px 0"><div><span class="m">Status</span><br><b>Awaiting Confirmation</b></div><div style="text-align:right"><span class="m">Time Remaining</span><br><span class="big">${cd(r)}</span></div></div><div class="btns"><button class="t" onclick="post('hospital/accept',{id:'${x.id}',hospital:'${hsel}'})">✓ ACCEPT AMBULANCE</button><button class="r" onclick="declineDlg('${x.id}','${hsel}')">✕ DECLINE</button></div><div style="margin-top:6px"><button onclick="detail('${x.id}','${hsel}')">VIEW DETAILS</button></div></div>`}
function pastCard(x){const t=x.request.attempts.find(t=>t.hospital_id==hsel),to=t.outcome=='TIMED_OUT';return `<div class="cap" style="margin-bottom:8px"><div class="row"><b>${x.id}</b><span class="b ${to?'HIGH':'CRITICAL'}">${to?'⏱ REQUEST TIMED OUT':'✕ REQUEST DECLINED'}</span></div>${t.reason?`<div>Reason: <b>${esc(t.reason)}</b></div>`:''}<div class="m">Request passed to next-best hospital</div></div>`}
function declineDlg(id,h){modalCtx=null;$('#md').innerHTML=`<div class="row"><h3>DECLINE AMBULANCE</h3><button onclick="$('#modal').style.display='none'">✕</button></div><p class="m">${id} · Optional reason:</p>${REASONS.map(r=>`<label style="display:block;padding:4px 0"><input type="radio" name="dr" value="${r}" style="flex:none;padding:0"> ${r}</label>`).join('')}<div class="btns" style="margin-top:12px"><button onclick="$('#modal').style.display='none'">Cancel</button><button class="r" onclick="doDecline('${id}','${h}')">✕ CONFIRM DECLINE</button></div>`;$('#modal').style.display='flex'}
async function doDecline(id,h){const c=document.querySelector('input[name=dr]:checked');await post('hospital/decline',{id,hospital:h,reason:c?c.value:null});$('#modal').style.display='none'}
function otherHosp(){const e=$('#opmatch');if(e)e.scrollIntoView({behavior:'smooth'})}
function ambReq(a){const r=a.request;if(!r)return'';const n=esc(r.hospital_name||''),at=(r.attempts||[]).map(t=>`<div>${t.outcome=='TIMED_OUT'?'⏱':'✕'} <b>${esc(t.hospital_name)}:</b> ${t.outcome=='TIMED_OUT'?'TIMED OUT':'DECLINED'}${t.reason?' · '+esc(t.reason):''}</div>`).join(''),prior=at?`<div style="margin:6px 0">${at}</div>`:'';
const body=r.status=='PENDING'?`${prior}${at?'<div class="m">Offering to next-best hospital...</div>':''}<b>AWAITING HOSPITAL CONFIRMATION</b><div>${n}</div><div class="big" style="margin:4px 0">${cd(r)}</div><span class="b HIGH">● Awaiting Confirmation</span>${at?' <span class="b">Offering Next Hospital</span>':''}`
:r.status=='ACCEPTED'?`<b>DESTINATION CONFIRMED</b><div>${n}</div><div style="margin:4px 0"><span class="b AVAILABLE">✓ ACCEPTED / CONFIRMED</span></div><div>ETA: <b>${a.eta!=null?pad2(a.eta)+' min':'—'}</b></div>${prior?`<div class="m" style="margin-top:6px">Earlier offers:</div>${prior}`:''}`
:`${prior}<b>NO SUITABLE HOSPITAL AVAILABLE</b><div class="m">Every candidate hospital declined or timed out.</div><div style="margin-top:8px"><button class="p" onclick="otherHosp()">CHOOSE ANOTHER HOSPITAL</button></div>`;
return `<div class="card ${r.status=='NO_HOSPITAL'?'alert':r.status=='ACCEPTED'?'sel':''}"><h3>HOSPITAL REQUEST</h3>${body}</div>`}
function dispReq(A){return `<div class="card"><h3>HOSPITAL REQUESTS</h3>${Object.values(A).filter(x=>x.request).map(x=>{const r=x.request,n=esc(r.hospital_name||'—'),at=(r.attempts||[]).map(t=>`<div class="m">${t.outcome=='TIMED_OUT'?'⏱':'✕'} ${esc(t.hospital_name)}: ${t.outcome=='TIMED_OUT'?'timed out':'declined'}${t.reason?' · '+esc(t.reason):''}</div>`).join('');
return `<div class="cap" style="margin-bottom:8px"><b>${x.id}</b>${r.status=='NO_HOSPITAL'?'':' → '+n}${at}<div>Status: <span class="b ${r.status=='ACCEPTED'?'AVAILABLE':r.status=='PENDING'?'HIGH':'CRITICAL'}">${r.status=='ACCEPTED'?'HOSPITAL ACCEPTED':r.status=='PENDING'?'AWAITING CONFIRMATION':'NO SUITABLE HOSPITAL AVAILABLE'}</span>${r.status=='PENDING'?' '+cd(r):''}</div>${r.status=='PENDING'?`<div style="margin-top:6px"><button onclick="hsel='${r.hospital_id}';mx=null;render()">Open ${n} console</button></div>`:''}</div>`}).join('')||'<span class="m">No hospital requests yet</span>'}</div>`}
function hospitalSection(){const H=S.hospitals[hsel],rqs=Object.values(S.ambulances).filter(x=>x.request&&x.request.hospital_id==hsel&&x.patient&&!['AVAILABLE','ARRIVED'].includes(x.status)),pend=rqs.filter(x=>x.request.status=='PENDING'),inc=rqs.filter(x=>x.request.status!='PENDING'),past=Object.values(S.ambulances).filter(x=>x.request&&x.request.hospital_id!=hsel&&(x.request.attempts||[]).some(t=>t.hospital_id==hsel)&&x.patient&&!['AVAILABLE','ARRIVED'].includes(x.status)),log=H.log.filter(e=>hfilt=='all'||e.cat==hfilt),all=[...Object.values(H.capacity),...Object.values(H.supplies)];
const row=(k,n,[q,t,ts])=>{const [c,l]=k=='capacity'?capSt(q,t):supSt(q,t);return `<tr><td>${n}</td><td>${ctl(k,n,q)} <small class="m">/ ${t}</small></td><td><span class="b ${c}">${l}</span></td><td>${fr(ts)}</td></tr>${k=='supplies'?`<tr><td colspan="4" style="padding:0;border:0"><div class="bar"><i class="${c}" style="width:${Math.min(100,q/t*100)}%"></i></div></td></tr>`:''}`};
return `<section class="col h"><h2>🏥 HOSPITAL CONSOLE</h2>
<div class="card sel"><div class="row"><div><span class="big">${H.name}</span><div><span class="b AVAILABLE">● ${H.accepting?'ACCEPTING PATIENTS':'DIVERSION'}</span> <small class="m">oldest data:</small> ${fr(Math.min(...all.map(r=>r[2])))}</div></div><label class="m">Hospital: <select class="hs" onchange="hsel=this.value;mx=null;render()">${Object.entries(S.hospitals).map(([k,h])=>`<option value="${k}" ${k==hsel?'selected':''}>${h.name}</option>`).join('')}</select></label></div>
<div style="margin-top:8px"><button onclick="post('hospital/freshness',{hospital:hsel,mode:'verify'})">Verify all data</button> <button onclick="post('hospital/freshness',{hospital:hsel,mode:'age'})">Simulate stale data (demo)</button></div></div>
${pend.map(reqCard).join('')}
<div class="card"><h3>EMERGENCY CAPACITY</h3><table><tr><th>Resource</th><th>Available</th><th>Status</th><th>Freshness</th></tr>${Object.entries(H.capacity).map(([n,r])=>row('capacity',n,r)).join('')}</table></div>
<div class="card"><h3>🚑 INCOMING AMBULANCES</h3>${(inc.map(x=>{const r=x.request;return r.status=='ACCEPTED'?`<div class="cap" style="margin-bottom:8px"><div class="row"><b>${x.id}</b><span class="b AVAILABLE">✓ ACCEPTED</span></div>${r.required.includes('Trauma Bay')?'<div>Trauma Bay Preparation: <b>REQUIRED</b></div>':''}<div>ETA: <b>${x.eta!=null?pad2(x.eta)+' min':'—'}</b> · Triage ${x.score} · ${x.patient.type}</div><div class="m">SpO₂ ${x.vitals.spo2}% · HR ${x.vitals.hr}</div><div style="margin-top:6px"><button onclick="post('hospital/prepare',{id:'${x.id}'})">PREPARE TRAUMA BAY</button> <button onclick="detail('${x.id}','${hsel}')">VIEW DETAILS</button></div></div>`:`<div class="cap" style="margin-bottom:8px"><div class="row"><b>${x.id}</b><span class="b CRITICAL">✕ REQUEST DECLINED</span></div><div>Reason: <b>${esc(r.decline_reason||'Not specified')}</b></div></div>`}).join('')+past.map(pastCard).join(''))||(pend.length?'<span class="m">No accepted or declined requests yet</span>':'<span class="m">No incoming ambulances for this hospital</span>')}</div>
<div class="card"><h3>SUPPLIES & RESOURCES</h3><table>${Object.entries(H.supplies).map(([n,r])=>row('supplies',n,r)).join('')}</table></div>
<div class="card"><h3>STAFF AVAILABILITY <small class="m">(click to change)</small></h3>${Object.entries(H.staff).map(([k,s])=>`<div class="row" style="padding:3px 0"><span>${k}</span><button onclick="post('hospital/staff',{hospital:hsel,role:'${k}'})"><span class="b ${s=='AVAILABLE'?'AVAILABLE':s=='BUSY'?'BUSY':''}">● ${s}</span></button></div>`).join('')}</div>
<div class="card"><div class="row"><h3>STAFF ACTIVITY LOG</h3><select onchange="hfilt=this.value;render()">${[['all','All'],['capacity','Capacity'],['supplies','Supplies'],['staff','Staff'],['emergency','Emergency'],['system','System']].map(([k,l])=>`<option value="${k}" ${k==hfilt?'selected':''}>${l}</option>`).join('')}</select></div><div class="feed">${log.map(e=>`<div><time>${e.t}</time><b>${e.msg?e.msg:e.name}</b>${e.msg?'':` &nbsp;${e.prev} → ${e.new}`}<div class="m" style="font-size:12px">${e.by} · ${fr(e.ts)}</div></div>`).join('')||'<span class="m">No updates yet</span>'}</div></div></section>`}
function render(){const ci=$('#chat'),cv=ci?ci.value:'',cf=document.activeElement===ci;_render();const n=$('#chat');if(n){n.value=cv;if(cf)n.focus()}const l=$('#chatlog');if(l)l.scrollTop=l.scrollHeight}
function _render(){const A=S.ambulances,a=A['AMB-204'],v=a.vitals;
const incoming=Object.values(A).filter(x=>x.patient&&x.status!='AVAILABLE'&&x.status!='ARRIVED'&&x.dest.includes('CityCare'));
const evs=S.events.filter(e=>filt=='all'||(filt=='crit'?e.crit:e.src==filt));
const crit=S.events.find(e=>e.crit);
$('#app').innerHTML=`
<section class="col a"><h2>🚑 AMBULANCE CONSOLE</h2>
<div class="card"><div class="row"><span class="big">${a.id}</span><span class="b ${a.level}">${a.status}</span></div><div class="grid m" style="margin-top:8px"><div>Location<br><b style="color:var(--tx)">${a.loc}</b></div><div>Destination<br><b style="color:var(--tx)">${a.dest}</b></div><div>Speed<br><b style="color:var(--tx)">${a.speed} km/h</b></div><div>ETA<br><b style="color:var(--tx)">${a.eta!=null?String(a.eta).padStart(2,'0')+' min':'—'}</b></div></div><div class="m" style="margin-top:6px">Crew: ${a.crew.join(' · ')}</div></div>
${v?`<div class="card ${a.level=='CRITICAL'?'alert pulse':''}" id="notif"><h3>🚨 INCOMING AMBULANCE ALERT</h3><div class="row"><div><b>${a.patient.type} patient</b><div>BP ${v.sys}/${v.dia} · HR ${v.hr} BPM · SpO₂ ${v.spo2}%</div><div class="m">Priority: <b>${a.level}</b></div></div></div></div>`:''}
${ambReq(a)}
<div class="card"><h3>AI TRIAGE SCORE <small class="m">(rule-based demo, not clinical)</small></h3><div class="row">${gauge(a.score,a.level)}<div style="text-align:right"><span class="b ${a.level}">${a.level}</span><div class="m">${a.prev!=null&&a.prev!==a.score?'previous '+a.prev:''}</div></div></div></div>
<div class="card"><h3>CONTROLS</h3><div class="btns"><button class="r" onclick="post('ambulance/alert',{id:'${a.id}'})">Send Emergency Alert</button><button onclick="post('ambulance/vitals',{id:'${a.id}',vitals:{hr:${v?v.hr:110},spo2:${v?v.spo2:92},sys:${v?v.sys:100},dia:${v?v.dia:65},rr:${v?v.rr:24}}})">Update Patient Vitals</button><button onclick="post('ambulance/location',{id:'${a.id}'})">Update Location</button><button onclick="post('ambulance/action',{id:'${a.id}',action:'worsen'})">Patient Condition Worsening</button><button class="p" onclick="post('ambulance/action',{id:'${a.id}',action:'request'})">Request Hospital</button><button onclick="post('ambulance/action',{id:'${a.id}',action:'arrived'})">Arrived at Hospital</button><button class="t" onclick="post('ambulance/action',{id:'${a.id}',action:'stable'})">Mark Patient Stable</button></div></div>
${chatMatch()}
<div class="card"><h3>NOTIFICATION HISTORY</h3><div class="feed">${S.events.filter(e=>e.src=='ambulance').map(e=>`<div><time>${e.t}</time>${e.msg}</div>`).join('')||'<span class="m">No notifications yet</span>'}</div></div></section>
${hospitalSection()}
<section class="col d"><h2>🚨 DISPATCH COMMAND CENTER</h2>
${crit&&Date.now()-lastEv<9000?`<div class="card alert pulse"><h3>🚨 CRITICAL PATIENT UPDATE</h3>${crit.msg}<div class="m">Received ${crit.t} · hospital preparation required</div></div>`:''}
<div class="card"><h3>ACTIVE AMBULANCES</h3><table><tr><th>Ambulance</th><th>Status</th><th>Priority</th><th>ETA</th><th>Hospital</th></tr>${Object.values(A).map(x=>`<tr class="cl" onclick="detail('${x.id}')"><td><b>${x.id}</b></td><td><span class="b ${x.status=='EMERGENCY'?'CRITICAL':x.status=='AVAILABLE'?'AVAILABLE':''}">${x.status}</span></td><td>${x.level!='—'?`<span class="b ${x.level}">${x.level}</span>`:'—'}</td><td>${x.eta!=null?String(x.eta).padStart(2,'0')+'m':'—'}</td><td>${x.dest}</td></tr>`).join('')}</table></div>
${dispReq(A)}
<div class="card"><h3>LIVE DISPATCH MAP <small class="m">(simulated)</small></h3>${map()}</div>
<div class="card"><div class="row"><h3>LIVE EVENT STREAM / SYSTEM HISTORY</h3><select onchange="filt=this.value;render()">${[['all','All'],['ambulance','Ambulance'],['hospital','Hospital'],['dispatch','Dispatch'],['crit','Critical']].map(([k,l])=>`<option value="${k}" ${k==filt?'selected':''}>${l}</option>`).join('')}</select></div><div class="feed">${evs.map(e=>`<div><time>${e.t}</time>${{ambulance:'🚑',hospital:'🏥',dispatch:'📍'}[e.src]} ${e.msg}</div>`).join('')||'<span class="m">No events</span>'}</div></div>
<details class="card" open><summary>🔌 LIVE BACKEND CONNECTION — <span style="color:var(--teal)">● Connected · SSE stream</span></summary><div class="feed" style="margin-top:8px">${S.api_log.map(l=>`<div><time>${l.t}</time><b>${l.m}</b> ${l.p} <span class="b ${l.s==200?'OK':'CRITICAL'}">${l.s} ${l.s==200?'OK':'ERR'}</span></div>`).join('')||'<span class="m">No requests yet</span>'}</div></details></section>`;
$('#nc').textContent=S.events.filter(e=>e.crit).length}
function connect(){const es=new EventSource('/api/stream');es.onopen=()=>{$('#live').className='on';$('#lt').textContent='SYSTEM ONLINE'};
es.onmessage=m=>{const n=JSON.parse(m.data);const top=n.events[0];if(S&&top&&JSON.stringify(top)!==JSON.stringify(S.events[0])){flash();lastEv=Date.now();toast((top.crit?'🚨 ':'')+top.msg)}S=n;off=n.now*1000-Date.now();if(!(document.activeElement&&document.activeElement.tagName=='SELECT'))render();if(modalCtx&&$('#modal').style.display=='flex'&&S.ambulances[modalCtx.id]&&sigOf(S.ambulances[modalCtx.id])!==modalSig)renderDetail()};
es.onerror=()=>{$('#live').className='';$('#lt').textContent='RECONNECTING…'}}
connect();
</script></body></html>
